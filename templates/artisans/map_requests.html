{% extends 'base.html' %}

{% block title %}Demandes de service - Carte{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    #map { height: 100vh; width: 100%; }
    .request-card { cursor: pointer; transition: all 0.3s; }
    .request-card:hover { background-color: #f3f4f6; transform: translateX(5px); }
    .urgency-urgent { border-left: 4px solid #ef4444; }
    .urgency-high { border-left: 4px solid #f59e0b; }
    .urgency-medium { border-left: 4px solid #3b82f6; }
    .urgency-low { border-left: 4px solid #6b7280; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid p-0" style="height: 100vh;">
    <div class="row g-0" style="height: 100%;">
        <!-- Sidebar -->
        <div class="col-md-4 col-lg-3 bg-light" style="height: 100vh; overflow-y: auto;">
            <div class="p-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">
                        <i class="fas fa-tasks"></i> Demandes
                    </h5>
                    <span class="badge bg-warning" id="requestCount">0</span>
                </div>

                <button class="btn btn-info w-100 mb-3" onclick="useMyLocation()">
                    <i class="fas fa-crosshairs"></i> Ma position
                </button>

                <!-- Filtres -->
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white py-2">
                        <small><i class="fas fa-filter"></i> Filtres</small>
                    </div>
                    <div class="card-body p-2">
                        <select class="form-select form-select-sm mb-2" id="categoryFilter" onchange="loadRequests()">
                            <option value="">🔧 Toutes catégories</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name_fr }}</option>
                            {% endfor %}
                        </select>

                        <select class="form-select form-select-sm" id="urgencyFilter" onchange="loadRequests()">
                            <option value="">⏱️ Toutes urgences</option>
                            <option value="urgent">🔴 Urgent</option>
                            <option value="high">🟠 Haute</option>
                            <option value="medium">🔵 Moyenne</option>
                            <option value="low">⚪ Basse</option>
                        </select>
                    </div>
                </div>

                <!-- Liste demandes -->
                <div id="requestsList">
                    <div class="text-center text-muted py-4">
                        <i class="fas fa-spinner fa-spin fa-2x mb-2"></i>
                        <p class="small">Chargement des demandes...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Carte -->
        <div class="col-md-8 col-lg-9">
            <div id="map"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let markers = [];
let markersLayer;
let userLocation = null;
let allRequests = [];

function initMap() {
    map = L.map('map').setView([33.9716, -6.8498], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
    }).addTo(map);

    markersLayer = L.layerGroup().addTo(map);

    useMyLocation();
}

function useMyLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };

                map.setView([userLocation.lat, userLocation.lng], 14);

                // Marqueur artisan
                L.marker([userLocation.lat, userLocation.lng], {
                    icon: L.divIcon({
                        html: '<div style="background: #10b981; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white;"></div>',
                        iconSize: [20, 20],
                        className: ''
                    })
                }).addTo(map).bindPopup("🔧 Vous êtes ici (Artisan)");

                loadRequests();
            },
            () => {
                loadRequests();
            }
        );
    } else {
        loadRequests();
    }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function loadRequests() {
    const category = document.getElementById('categoryFilter').value;
    const urgency = document.getElementById('urgencyFilter').value;

    const params = new URLSearchParams();
    if (category) params.append('category', category);
    if (urgency) params.append('urgency', urgency);

    fetch(`/artisans/api/requests/?${params}`)
        .then(response => response.json())
        .then(data => {
            allRequests = data.requests.map(req => {
                if (userLocation) {
                    req.distance = calculateDistance(
                        userLocation.lat, userLocation.lng,
                        req.latitude, req.longitude
                    );
                }
                return req;
            });

            if (userLocation) {
                allRequests.sort((a, b) => a.distance - b.distance);
            }

            displayRequestsOnMap(allRequests);
            displayRequestsList(allRequests);
        })
        .catch(error => console.error('Erreur:', error));
}

function displayRequestsOnMap(requests) {
    markersLayer.clearLayers();
    markers = [];

    requests.forEach((req, index) => {
        let color, emoji;

        switch(req.urgency) {
            case 'urgent': color = '#ef4444'; emoji = '🔴'; break;
            case 'high': color = '#f59e0b'; emoji = '🟠'; break;
            case 'medium': color = '#3b82f6'; emoji = '🔵'; break;
            default: color = '#6b7280'; emoji = '⚪';
        }

        const icon = L.divIcon({
            html: `
                <div style="
                    background: ${color};
                    width: 40px;
                    height: 40px;
                    border-radius: 50% 50% 50% 0;
                    border: 3px solid white;
                    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 20px;
                    transform: rotate(-45deg);
                ">
                    <span style="transform: rotate(45deg);">💼</span>
                </div>
            `,
            iconSize: [40, 40],
            iconAnchor: [12, 40],
            popupAnchor: [8, -40],
            className: ''
        });

        const marker = L.marker([req.latitude, req.longitude], {icon}).addTo(markersLayer);

        const distanceText = req.distance ?
            `<span class="badge bg-info">📍 ${req.distance.toFixed(1)} km</span>` : '';

        const popupContent = `
            <div style="min-width: 250px;">
                <h6>${req.title}</h6>
                <p class="small mb-2">${req.description.substring(0, 100)}...</p>
                <p class="small mb-1"><strong>Catégorie:</strong> ${req.category}</p>
                <p class="small mb-1"><strong>Urgence:</strong> ${emoji} ${req.urgency}</p>
                <p class="small mb-2"><strong>Adresse:</strong> ${req.address}</p>
                ${distanceText}
                <a href="/artisans/requests/${req.id}/" class="btn btn-success btn-sm w-100 mt-2">
                    <i class="fas fa-eye"></i> Voir la demande
                </a>
            </div>
        `;

        marker.bindPopup(popupContent);
        markers.push({marker, req});
    });
}

function displayRequestsList(requests) {
    const container = document.getElementById('requestsList');
    const count = document.getElementById('requestCount');

    count.textContent = requests.length;

    if (requests.length === 0) {
        container.innerHTML = `
            <div class="alert alert-info small">
                <i class="fas fa-info-circle"></i> Aucune demande disponible
            </div>
        `;
        return;
    }

    let html = '';
    requests.forEach((req, index) => {
        let urgencyClass = `urgency-${req.urgency}`;
        let urgencyBadge = '';

        switch(req.urgency) {
            case 'urgent': urgencyBadge = '<span class="badge bg-danger">🔴 Urgent</span>'; break;
            case 'high': urgencyBadge = '<span class="badge bg-warning">🟠 Haute</span>'; break;
            case 'medium': urgencyBadge = '<span class="badge bg-info">🔵 Moyenne</span>'; break;
            default: urgencyBadge = '<span class="badge bg-secondary">⚪ Basse</span>';
        }

        const distanceBadge = req.distance ?
            `<span class="badge bg-primary">${req.distance.toFixed(1)} km</span>` : '';

        html += `
            <div class="card mb-2 request-card ${urgencyClass}" onclick="focusRequest(${index})">
                <div class="card-body p-2">
                    <h6 class="mb-1 small">${req.title}</h6>
                    <p class="mb-1 small text-muted">${req.category}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        ${urgencyBadge}
                        ${distanceBadge}
                    </div>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
}

function focusRequest(index) {
    if (markers[index]) {
        const {marker} = markers[index];
        map.setView(marker.getLatLng(), 16);
        marker.openPopup();
    }
}

document.addEventListener('DOMContentLoaded', initMap);
</script>
{% endblock %}
