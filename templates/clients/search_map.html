{% extends 'base.html' %}

{% block title %}Recherche d'artisans - Carte{% endblock %}

{% block content %}
<div class="container-fluid p-0" style="height: 100vh;">
    <div class="row g-0" style="height: 100%;">
        <!-- Sidebar avec filtres et liste -->
        <div class="col-md-4 bg-light" style="height: 100vh; overflow-y: auto;">
            <div class="p-3">
                <h4 class="mb-3">
                    <i class="fas fa-search"></i> Rechercher des artisans
                </h4>

                <!-- Filtres -->
                <div class="card mb-3">
                    <div class="card-body">
                        <form id="searchForm">
                            <div class="mb-3">
                                <label class="form-label">Catégorie</label>
                                <select class="form-select" id="categoryFilter" name="category">
                                    <option value="">Toutes les catégories</option>
                                    {% for cat in categories %}
                                        <option value="{{ cat.id }}">{{ cat.name_fr }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Ville</label>
                                <input type="text" class="form-control" id="cityFilter" name="city" placeholder="Ex: Rabat">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Note minimale</label>
                                <select class="form-select" id="ratingFilter" name="min_rating">
                                    <option value="">Toutes les notes</option>
                                    <option value="4">4+ étoiles</option>
                                    <option value="3">3+ étoiles</option>
                                    <option value="2">2+ étoiles</option>
                                </select>
                            </div>

                            <button type="button" class="btn btn-primary w-100" onclick="searchArtisans()">
                                <i class="fas fa-search"></i> Rechercher
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Liste des artisans -->
                <div id="artisansList">
                    <p class="text-muted text-center">
                        <i class="fas fa-spinner fa-spin"></i> Chargement...
                    </p>
                </div>
            </div>
        </div>

        <!-- Carte -->
        <div class="col-md-8">
            <div id="map" style="height: 100vh; width: 100%;"></div>
        </div>
    </div>
</div>

<!-- Floating button pour revenir à la liste -->
<a href="{% url 'clients:search_artisans' %}" class="btn btn-primary position-fixed" style="bottom: 20px; left: 20px; z-index: 1000;">
    <i class="fas fa-list"></i> Vue liste
</a>
{% endblock %}

{% block extra_js %}
<script>
// Charger Google Maps API avec la clé depuis Django
(function() {
    const script = document.createElement('script');
    script.src = 'https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&callback=initMap&libraries=places&loading=async';
    script.async = true;
    script.defer = true;
    document.head.appendChild(script);
})();
</script>

<script>
let map;
let markers = [];
let infoWindows = [];

// Initialiser la carte
function initMap() {
    // Centre sur le Maroc (Rabat)
    const defaultCenter = { lat: 33.9716, lng: -6.8498 };

    map = new google.maps.Map(document.getElementById('map'), {
        zoom: 12,
        center: defaultCenter,
        styles: [
            {
                featureType: "poi",
                elementType: "labels",
                stylers: [{ visibility: "off" }]
            }
        ]
    });

    // Demander la géolocalisation de l'utilisateur
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                map.setCenter(userLocation);

                // Ajouter un marqueur pour l'utilisateur
                new google.maps.Marker({
                    position: userLocation,
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 10,
                        fillColor: "#4285F4",
                        fillOpacity: 1,
                        strokeColor: "#ffffff",
                        strokeWeight: 2
                    },
                    title: "Vous êtes ici"
                });
            },
            () => {
                console.log("Géolocalisation refusée - utilisation de la position par défaut");
                // Rester sur Rabat si géolocalisation refusée
            }
        );
    } else {
        console.log("Géolocalisation non supportée par ce navigateur");
    }

    // Charger les artisans
    loadArtisans();
}

// Charger les artisans
function loadArtisans(filters = {}) {
    const params = new URLSearchParams(filters);

    fetch(`{% url 'clients:api_artisans' %}?${params}`)
        .then(response => response.json())
        .then(data => {
            displayArtisansOnMap(data.artisans);
            displayArtisansList(data.artisans);
        })
        .catch(error => {
            console.error('Erreur:', error);
        });
}

// Afficher les artisans sur la carte
function displayArtisansOnMap(artisans) {
    // Supprimer les anciens marqueurs
    markers.forEach(marker => marker.setMap(null));
    markers = [];
    infoWindows.forEach(infoWindow => infoWindow.close());
    infoWindows = [];

    // Ajouter les nouveaux marqueurs
    artisans.forEach(artisan => {
        const position = { lat: artisan.latitude, lng: artisan.longitude };

        const marker = new google.maps.Marker({
            position: position,
            map: map,
            title: artisan.business_name,
            icon: {
                url: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
            }
        });

        const infoContent = `
            <div style="padding: 10px; max-width: 250px;">
                ${artisan.profile_photo ? `<img src="${artisan.profile_photo}" style="width: 100%; height: 100px; object-fit: cover; border-radius: 5px; margin-bottom: 10px;">` : ''}
                <h6 style="margin: 0 0 5px 0;">${artisan.business_name}</h6>
                <div style="color: #ffc107; margin-bottom: 5px;">
                    ${'★'.repeat(Math.round(artisan.rating))}${'☆'.repeat(5 - Math.round(artisan.rating))}
                    <span style="color: #666;">${artisan.rating.toFixed(1)} (${artisan.total_reviews})</span>
                </div>
                <p style="margin: 5px 0; font-size: 12px; color: #666;">
                    <i class="fas fa-map-marker-alt"></i> ${artisan.city}
                </p>
                ${artisan.phone ? `<p style="margin: 5px 0; font-size: 12px;"><i class="fas fa-phone"></i> ${artisan.phone}</p>` : ''}
                <div style="margin-top: 10px;">
                    <a href="${artisan.url}" class="btn btn-primary btn-sm" style="width: 100%;">
                        <i class="fas fa-eye"></i> Voir le profil
                    </a>
                </div>
            </div>
        `;

        const infoWindow = new google.maps.InfoWindow({
            content: infoContent
        });

        marker.addListener('click', () => {
            // Fermer toutes les fenêtres
            infoWindows.forEach(iw => iw.close());
            // Ouvrir cette fenêtre
            infoWindow.open(map, marker);
        });

        markers.push(marker);
        infoWindows.push(infoWindow);
    });

    // Ajuster la vue pour inclure tous les marqueurs
    if (markers.length > 0) {
        const bounds = new google.maps.LatLngBounds();
        markers.forEach(marker => bounds.extend(marker.getPosition()));
        map.fitBounds(bounds);
    }
}

// Afficher la liste des artisans
function displayArtisansList(artisans) {
    const listContainer = document.getElementById('artisansList');

    if (artisans.length === 0) {
        listContainer.innerHTML = `
            <div class="alert alert-info">
                <i class="fas fa-info-circle"></i> Aucun artisan trouvé avec ces critères
            </div>
        `;
        return;
    }

    let html = `<p class="text-muted mb-3">${artisans.length} artisan(s) trouvé(s)</p>`;

    artisans.forEach(artisan => {
        html += `
            <div class="card mb-2" style="cursor: pointer;" onclick="focusArtisan(${artisan.latitude}, ${artisan.longitude})">
                <div class="card-body p-2">
                    <div class="d-flex align-items-center">
                        ${artisan.profile_photo ?
                            `<img src="${artisan.profile_photo}" class="rounded-circle me-2" width="50" height="50" style="object-fit: cover;">` :
                            `<i class="fas fa-user-circle fa-3x text-secondary me-2"></i>`
                        }
                        <div class="flex-grow-1">
                            <h6 class="mb-0">${artisan.business_name}</h6>
                            <small class="text-warning">
                                ${'★'.repeat(Math.round(artisan.rating))} ${artisan.rating.toFixed(1)}
                            </small>
                            <br>
                            <small class="text-muted">
                                <i class="fas fa-map-marker-alt"></i> ${artisan.city}
                            </small>
                        </div>
                        <a href="${artisan.url}" class="btn btn-sm btn-primary">
                            <i class="fas fa-eye"></i>
                        </a>
                    </div>
                </div>
            </div>
        `;
    });

    listContainer.innerHTML = html;
}

// Centrer sur un artisan
function focusArtisan(lat, lng) {
    map.setCenter({ lat, lng });
    map.setZoom(15);
}

// Rechercher avec filtres
function searchArtisans() {
    const category = document.getElementById('categoryFilter').value;
    const city = document.getElementById('cityFilter').value;
    const rating = document.getElementById('ratingFilter').value;

    const filters = {};
    if (category) filters.category = category;
    if (city) filters.city = city;
    if (rating) filters.min_rating = rating;

    loadArtisans(filters);
}

// Charger au démarrage si la carte n'est pas initialisée
if (typeof google === 'undefined') {
    window.initMap = initMap;
}
</script>

<style>
    .gm-style-iw {
        max-width: 300px !important;
    }

    .gm-style-iw-d {
        overflow: hidden !important;
    }
</style>
{% endblock %}
