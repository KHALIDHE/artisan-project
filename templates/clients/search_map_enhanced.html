{% extends 'base.html' %}

{% block title %}Trouver des artisans près de moi{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    #map { height: 100vh; width: 100%; }
    .leaflet-popup-content { margin: 10px; min-width: 250px; }
    .artisan-popup img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
    .artisan-card { cursor: pointer; transition: all 0.3s; }
    .artisan-card:hover { background-color: #f3f4f6; transform: translateX(5px); }
    .distance-badge { background: #3b82f6; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
    .user-marker { animation: pulse 2s infinite; }
    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.1); }
    }
    .custom-marker {
        animation: dropIn 0.5s ease-out;
    }
    @keyframes dropIn {
        0% { transform: translateY(-100px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid p-0" style="height: 100vh;">
    <div class="row g-0" style="height: 100%;">
        <!-- Sidebar -->
        <div class="col-md-4 col-lg-3 bg-light" style="height: 100vh; overflow-y: auto;">
            <div class="p-3">
                <!-- Header avec position -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">
                        <i class="fas fa-map-marked-alt"></i> Artisans
                    </h5>
                    <span class="badge bg-primary" id="artisanCount">0</span>
                </div>

                <!-- Bouton Ma Position -->
                <button class="btn btn-info w-100 mb-2" id="locationBtn" onclick="useMyLocation()">
                    <i class="fas fa-crosshairs"></i> Utiliser ma position
                </button>

                <!-- Accuracy Info -->
                <div id="accuracyInfo" class="alert alert-info py-2 mb-3" style="display: none; font-size: 0.85rem;">
                    <i class="fas fa-info-circle"></i>
                    <span id="accuracyText"></span>
                </div>

                <!-- Filtres -->
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white py-2">
                        <small><i class="fas fa-filter"></i> Filtres</small>
                    </div>
                    <div class="card-body p-2">
                        <select class="form-select form-select-sm mb-2" id="categoryFilter" onchange="searchArtisans()">
                            <option value="">🔧 Toutes catégories</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.icon }} {{ cat.name_fr }}</option>
                            {% endfor %}
                        </select>

                        <select class="form-select form-select-sm mb-2" id="distanceFilter" onchange="searchArtisans()">
                            <option value="100">📍 Toutes distances</option>
                            <option value="1">Dans 1 km</option>
                            <option value="2">Dans 2 km</option>
                            <option value="5">Dans 5 km</option>
                            <option value="10">Dans 10 km</option>
                        </select>

                        <select class="form-select form-select-sm" id="ratingFilter" onchange="searchArtisans()">
                            <option value="">⭐ Toutes notes</option>
                            <option value="4.5">4.5+ étoiles</option>
                            <option value="4">4+ étoiles</option>
                            <option value="3">3+ étoiles</option>
                        </select>
                    </div>
                </div>

                <!-- Liste des artisans -->
                <div id="artisansList">
                    <div class="text-center text-muted py-4">
                        <i class="fas fa-location-arrow fa-2x mb-2"></i>
                        <p class="small">Activez votre position pour voir les artisans près de vous</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Carte -->
        <div class="col-md-8 col-lg-9">
            <div id="map"></div>
        </div>
    </div>
</div>

<!-- Floating buttons -->
<div class="position-fixed" style="bottom: 20px; left: 20px; z-index: 1000;">
    <a href="{% url 'clients:search_artisans' %}" class="btn btn-light shadow mb-2">
        <i class="fas fa-list"></i>
    </a>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let markers = [];
let markersLayer;
let userLocation = null;
let userMarker = null;
let allArtisans = [];
let accuracyCircle = null;

// Icons personnalisés
const userIcon = L.divIcon({
    html: '<div class="user-marker" style="background: #3b82f6; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>',
    iconSize: [20, 20],
    className: ''
});

// Initialiser la carte
function initMap() {
    map = L.map('map').setView([33.9716, -6.8498], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
    }).addTo(map);

    markersLayer = L.layerGroup().addTo(map);

    // Demander géolocalisation automatiquement
    useMyLocation();
}

// Utiliser ma position avec accuracy
function useMyLocation() {
    console.log('🔍 Requesting location...');

    if (!navigator.geolocation) {
        alert('❌ Votre navigateur ne supporte pas la géolocalisation');
        loadArtisans();
        return;
    }

    const btn = document.getElementById('locationBtn');
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Localisation...';
    }

    navigator.geolocation.getCurrentPosition(
        // ✅ SUCCESS
        (position) => {
            const accuracy = position.coords.accuracy;

            console.log('✅ Position obtenue:');
            console.log('  Latitude:', position.coords.latitude);
            console.log('  Longitude:', position.coords.longitude);
            console.log('  Précision:', accuracy, 'mètres');

            userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
                accuracy: accuracy
            };

            // Update map view
            map.setView([userLocation.lat, userLocation.lng], 14);

            // Remove old marker and circle
            if (userMarker) map.removeLayer(userMarker);
            if (accuracyCircle) map.removeLayer(accuracyCircle);

            // Show accuracy circle
            accuracyCircle = L.circle([userLocation.lat, userLocation.lng], {
                radius: accuracy,
                color: '#3b82f6',
                fillColor: '#3b82f6',
                fillOpacity: 0.1,
                weight: 2,
                dashArray: '5, 5'
            }).addTo(map);

            // Add user marker
            userMarker = L.marker([userLocation.lat, userLocation.lng], {icon: userIcon})
                .addTo(map)
                .bindPopup(`
                    📍 <strong>Vous êtes ici</strong><br>
                    <small class="text-muted">
                        Précision: ±${Math.round(accuracy)}m
                        ${accuracy > 200 ? '<br>⚠️ Position approximative' : ''}
                    </small>
                `)
                .openPopup();

            // Show accuracy info
            updateAccuracyInfo(accuracy);

            // Reset button with accuracy indicator
            if (btn) {
                btn.disabled = false;
                const indicator = accuracy < 50 ? '🟢' : accuracy < 200 ? '🟡' : '🔴';
                btn.innerHTML = `<i class="fas fa-crosshairs"></i> Ma position ${indicator}`;
                btn.title = `Précision: ±${Math.round(accuracy)}m`;
            }

            // Load artisans
            loadArtisans();
        },

        // ❌ ERROR
        (error) => {
            console.error('❌ Erreur géolocalisation:', error);

            let errorMessage = '';
            let helpText = '';

            switch(error.code) {
                case 1: // PERMISSION_DENIED
                    errorMessage = "Permission refusée";
                    helpText = "Cliquez sur l'icône 🔒 dans la barre d'adresse et autorisez l'accès à la position";
                    break;

                case 2: // POSITION_UNAVAILABLE
                    errorMessage = "Position indisponible";
                    helpText = "Vérifiez que le GPS/Wi-Fi est activé";
                    break;

                case 3: // TIMEOUT
                    errorMessage = "Délai dépassé";
                    helpText = "La recherche de position a pris trop de temps. Réessayez.";
                    break;

                default:
                    errorMessage = "Erreur inconnue";
                    helpText = "Code: " + error.code;
            }

            alert(`📍 ${errorMessage}\n\n${helpText}`);

            // Reset button
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-crosshairs"></i> Utiliser ma position';
            }

            // Use default location (Rabat)
            console.log('⚠️ Using default location: Rabat');
            map.setView([33.9716, -6.8498], 12);
            loadArtisans();
        },

        // OPTIONS
        {
            enableHighAccuracy: true,   // Use GPS if available
            timeout: 15000,             // Wait 15 seconds
            maximumAge: 0               // Always get fresh position
        }
    );
}

// Update accuracy info display
function updateAccuracyInfo(accuracy) {
    const infoDiv = document.getElementById('accuracyInfo');
    const textSpan = document.getElementById('accuracyText');

    if (accuracy < 50) {
        textSpan.innerHTML = `Précision excellente: ±${Math.round(accuracy)}m 🟢`;
        infoDiv.className = 'alert alert-success py-2 mb-3';
    } else if (accuracy < 200) {
        textSpan.innerHTML = `Précision bonne: ±${Math.round(accuracy)}m 🟡`;
        infoDiv.className = 'alert alert-info py-2 mb-3';
    } else {
        textSpan.innerHTML = `Précision approximative: ±${Math.round(accuracy)}m 🔴<br>
            <small>Utilisez votre téléphone ou activez le Wi-Fi pour plus de précision</small>`;
        infoDiv.className = 'alert alert-warning py-2 mb-3';
    }

    infoDiv.style.display = 'block';
    infoDiv.style.fontSize = '0.85rem';
}

// Calculer distance (Haversine)
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Rayon terre en km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// Charger artisans
function loadArtisans(filters = {}) {
    const params = new URLSearchParams(filters);

    fetch(`{% url 'clients:api_artisans' %}?${params}`)
        .then(response => response.json())
        .then(data => {
            // Calculer distances
            allArtisans = data.artisans.map(artisan => {
                if (userLocation) {
                    artisan.distance = calculateDistance(
                        userLocation.lat, userLocation.lng,
                        artisan.latitude, artisan.longitude
                    );
                } else {
                    artisan.distance = null;
                }
                return artisan;
            });

            // Trier par distance
            if (userLocation) {
                allArtisans.sort((a, b) => a.distance - b.distance);
            }

            searchArtisans();
        })
        .catch(error => console.error('Erreur:', error));
}

// Rechercher avec filtres
function searchArtisans() {
    let filtered = [...allArtisans];

    // Filtre catégorie
    const category = document.getElementById('categoryFilter').value;
    if (category) {
        filtered = filtered.filter(a =>
            a.categories.some(c => c.includes(document.querySelector(`#categoryFilter option[value="${category}"]`).text.split(' ')[1]))
        );
    }

    // Filtre distance
    const maxDistance = parseFloat(document.getElementById('distanceFilter').value);
    if (maxDistance < 100 && userLocation) {
        filtered = filtered.filter(a => a.distance && a.distance <= maxDistance);
    }

    // Filtre note
    const minRating = parseFloat(document.getElementById('ratingFilter').value);
    if (minRating) {
        filtered = filtered.filter(a => a.rating >= minRating);
    }

    displayArtisansOnMap(filtered);
    displayArtisansList(filtered);
}

// Afficher sur carte avec emojis
function displayArtisansOnMap(artisans) {
    markersLayer.clearLayers();
    markers = [];

    artisans.forEach((artisan, index) => {
        const color = artisan.rating >= 4.5 ? '#10b981' :
                     artisan.rating >= 4 ? '#3b82f6' :
                     artisan.rating >= 3 ? '#f59e0b' : '#ef4444';

        // Icône personnalisée avec emoji selon catégorie
        let emoji = '🔧'; // Par défaut
        if (artisan.categories.length > 0) {
            const cat = artisan.categories[0].toLowerCase();
            if (cat.includes('plomb')) emoji = '🔧';
            else if (cat.includes('électr') || cat.includes('elect')) emoji = '⚡';
            else if (cat.includes('peinture')) emoji = '🎨';
            else if (cat.includes('menuiserie')) emoji = '🪚';
            else if (cat.includes('climatisation')) emoji = '❄️';
            else if (cat.includes('jardin')) emoji = '🌿';
            else if (cat.includes('nettoyage')) emoji = '🧹';
            else if (cat.includes('maçon')) emoji = '🧱';
        }

        // Marqueur avec icône HTML
        const icon = L.divIcon({
            html: `
                <div style="
                    background: ${color};
                    width: 40px;
                    height: 40px;
                    border-radius: 50% 50% 50% 0;
                    border: 3px solid white;
                    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 20px;
                    transform: rotate(-45deg);
                ">
                    <span style="transform: rotate(45deg);">${emoji}</span>
                </div>
            `,
            iconSize: [40, 40],
            iconAnchor: [12, 40],
            popupAnchor: [8, -40],
            className: 'custom-marker'
        });

        const marker = L.marker([artisan.latitude, artisan.longitude], {icon: icon}).addTo(markersLayer);

        const stars = '⭐'.repeat(Math.round(artisan.rating));
        const distanceText = artisan.distance ?
            `<span class="distance-badge">📍 ${artisan.distance.toFixed(1)} km</span>` : '';

        const popupContent = `
            <div class="artisan-popup">
                ${artisan.profile_photo ? `<img src="${artisan.profile_photo}">` : ''}
                <h6 class="mb-1">${artisan.business_name}</h6>
                <div class="mb-2">${stars} <small>${artisan.rating.toFixed(1)} (${artisan.total_reviews} avis)</small></div>
                ${distanceText}
                <p class="mb-2 small text-muted">
                    <i class="fas fa-map-marker-alt"></i> ${artisan.city}<br>
                    ${artisan.phone ? `<i class="fas fa-phone"></i> ${artisan.phone}` : ''}
                </p>
                <div class="row g-1">
                    <div class="col-6">
                        <a href="${artisan.url}" class="btn btn-primary btn-sm w-100">
                            <i class="fas fa-eye"></i> Profil
                        </a>
                    </div>
                    {% if user.is_authenticated and user.is_client %}
                    <div class="col-6">
                        <a href="/messages/start/${artisan.user_id}/" class="btn btn-info btn-sm w-100">
                            <i class="fas fa-comment"></i> Chat
                        </a>
                    </div>
                    <div class="col-12">
                        <a href="/clients/requests/create/${artisan.id}/" class="btn btn-success btn-sm w-100">
                            <i class="fas fa-paper-plane"></i> Envoyer demande
                        </a>
                    </div>
                    {% endif %}
                </div>
            </div>
        `;

        marker.bindPopup(popupContent);
        markers.push({marker, artisan});
    });

    if (markers.length > 0 && !userLocation) {
        const group = L.featureGroup(markers.map(m => m.marker));
        map.fitBounds(group.getBounds().pad(0.1));
    }
}

// Afficher liste
function displayArtisansList(artisans) {
    const container = document.getElementById('artisansList');
    const count = document.getElementById('artisanCount');

    count.textContent = artisans.length;

    if (artisans.length === 0) {
        container.innerHTML = `
            <div class="alert alert-info small">
                <i class="fas fa-info-circle"></i> Aucun artisan trouvé
            </div>
        `;
        return;
    }

    let html = '';
    artisans.forEach((artisan, index) => {
        const stars = '⭐'.repeat(Math.round(artisan.rating));
        const distanceBadge = artisan.distance ?
            `<span class="distance-badge">${artisan.distance.toFixed(1)} km</span>` : '';

        html += `
            <div class="card mb-2 artisan-card" onclick="focusArtisan(${index})">
                <div class="card-body p-2">
                    <div class="d-flex align-items-start">
                        ${artisan.profile_photo ?
                            `<img src="${artisan.profile_photo}" class="rounded me-2" width="50" height="50" style="object-fit: cover;">` :
                            `<div class="bg-secondary rounded me-2 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                                <i class="fas fa-user text-white"></i>
                            </div>`
                        }
                        <div class="flex-grow-1">
                            <h6 class="mb-0 small">${artisan.business_name}</h6>
                            <div class="small">${stars} ${artisan.rating.toFixed(1)}</div>
                            <small class="text-muted">${artisan.city}</small>
                            ${distanceBadge}
                        </div>
                    </div>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
}

// Focus sur artisan
function focusArtisan(index) {
    if (markers[index]) {
        const {marker, artisan} = markers[index];
        map.setView(marker.getLatLng(), 16);
        marker.openPopup();
    }
}

// Init
document.addEventListener('DOMContentLoaded', initMap);
</script>
{% endblock %}
